---
# Install collections: ansible-galaxy collection install -r ansible/requirements.yml
# Set secrets (vault recommended): proxmox_api_password, vyos_ssh_password

- name: Provision VyOS VM on Proxmox (Phase 1 hardware layout)
  hosts: proxmox_api
  gather_facts: false
  tags: [proxmox, provision, vm]
  roles:
    - role: proxmox_vyos_vm

- name: Configure VyOS Phase 1 (WAN DHCP, LAN + DHCP + DNS forwarders)
  hosts: vyos_gateway
  gather_facts: false
  tags: [vyos, configure, phase1]
  roles:
    - role: vyos_phase1
